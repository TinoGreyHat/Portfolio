# Portfolio TinoGreyHat - Spring Boot Configuration
# This file imports .env for environment-specific values

spring.application.name=Portfolio
spring.config.import=optional:file:../.env[.properties]

server.port=${SERVER_PORT:8080}

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
# Development: H2 in-memory (default profile)
# Production: PostgreSQL (prod profile)
spring.datasource.url=${DB_URL:jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# Connection pool settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# =============================================================================
# FLYWAY MIGRATION CONFIGURATION
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# =============================================================================
# JPA / HIBERNATE CONFIGURATION
# =============================================================================
# Use 'validate' for production to prevent accidental schema changes
# Use 'update' for development only
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false

# =============================================================================
# JWT CONFIGURATION
# =============================================================================
jwt.secret=${JWT_SECRET:dmVyeV9sb25nX3RlbXBvcmFyeV9zZWNyZXRfa2V5X3RoYXRfbXVzdF9iZV9jaGFuZ2VkX2luX3Byb2R1Y3Rpb25fZm9yX2hzNTEyX3RvX3dvcms=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =============================================================================
# ADMIN CONFIGURATION
# =============================================================================
admin.username=${ADMIN_USERNAME:admin}
admin.email=${ADMIN_EMAIL:admin@example.com}
admin.password=${ADMIN_PASSWORD:admin123}

# =============================================================================
# CORS CONFIGURATION
# =============================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =============================================================================
# FILE UPLOAD CONFIGURATION
# =============================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom upload directory (relative to project root or absolute path)
app.upload.dir=${UPLOAD_DIR:uploads/certifications}
app.upload.max-size=${UPLOAD_MAX_SIZE:10485760}

# =============================================================================
# MAIL CONFIGURATION
# =============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
mail.to=${MAIL_TO:teteblaise9@gmail.com}

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging.level.root=INFO
logging.level.com.blaise=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n