# Portfolio TinoGreyHat - Production Profile
# Activated with: --spring.profiles.active=prod
# Requires: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, ADMIN_PASSWORD, CORS_ALLOWED_ORIGINS, MAIL_USERNAME, MAIL_PASSWORD

# =============================================================================
# PRODUCTION DATABASE (PostgreSQL)
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Connection pool settings (HikariCP) - tuned for production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# =============================================================================
# JPA / HIBERNATE - PRODUCTION SETTINGS
# =============================================================================
# CRITICAL: Use 'validate' in production to prevent accidental schema changes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# =============================================================================
# LOGGING - PRODUCTION
# =============================================================================
logging.level.root=WARN
logging.level.com.blaise=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================================================
# SECURITY - PRODUCTION
# =============================================================================
# Ensure HTTPS in production (configure via reverse proxy / load balancer)
server.forward-headers-strategy=framework